services:
  - type: web
    name: voisins-connect-backend
    env: docker
    plan: free
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: PORT
        value: "3001"
