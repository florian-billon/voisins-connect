services:
  - type: web
    name: voisins-connect-backend
    env: rust
    plan: free
    buildCommand: cd backend && cargo build --release
    startCommand: cd backend && ./target/release/hello_world_backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: PORT
        value: "3001"
